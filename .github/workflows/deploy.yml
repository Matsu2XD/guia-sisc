name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnóstico de conexão SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set +e
          if [ -z "$VPS_HOST" ]; then echo "::error::VPS_HOST vazio"; exit 1; fi
          if [ -z "$VPS_USER" ]; then echo "::error::VPS_USER vazio"; exit 1; fi
          if [ -z "$VPS_SSH_KEY" ]; then echo "::error::VPS_SSH_KEY vazio"; exit 1; fi
          echo "::notice::host len=${#VPS_HOST} | user len=${#VPS_USER} | key bytes=$(printf '%s' "$VPS_SSH_KEY" | wc -c)"
          printf '%s\n' "$VPS_SSH_KEY" > /tmp/key
          chmod 600 /tmp/key
          if ssh-keygen -y -f /tmp/key > /dev/null 2>/tmp/keyerr; then
            echo "::notice::chave privada válida"
          else
            echo "::error::chave privada inválida: $(cat /tmp/keyerr)"
            exit 1
          fi
          if timeout 10 bash -c "echo > /dev/tcp/$VPS_HOST/22" 2>/dev/null; then
            echo "::notice::TCP 22 OK"
          else
            echo "::error::TCP 22 inacessível em [$VPS_HOST]"
            exit 1
          fi
          if OUT=$(ssh -v -i /tmp/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'echo CONECTADO' 2>&1); then
            echo "::notice::SSH OK: $OUT"
          else
            echo "::error::SSH falhou: $OUT"
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          debug: true
          script: |
            cd /var/www/guia-sisc
            git pull origin master
            npm ci
            npm run build
            echo "Deploy concluído — $(date)"
