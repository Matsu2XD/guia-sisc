name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnóstico de conexão SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ]; then echo "::error::VPS_HOST vazio"; exit 1; fi
          if [ -z "$VPS_USER" ]; then echo "::error::VPS_USER vazio"; exit 1; fi
          if [ -z "$VPS_SSH_KEY" ]; then echo "::error::VPS_SSH_KEY vazio"; exit 1; fi
          echo "host len=${#VPS_HOST} | user len=${#VPS_USER} | key bytes=$(printf '%s' "$VPS_SSH_KEY" | wc -c)"
          printf '%s\n' "$VPS_SSH_KEY" > /tmp/key
          chmod 600 /tmp/key
          if timeout 10 bash -c "echo > /dev/tcp/$VPS_HOST/22" 2>/dev/null; then
            echo "TCP 22 OK"
          else
            echo "::error::TCP 22 inacessível"
          fi
          OUT=$(ssh -i /tmp/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'echo CONECTADO' 2>&1)
          CODE=$?
          if [ $CODE -ne 0 ]; then
            echo "::error::SSH falhou: $OUT"
            exit 1
          fi
          echo "SSH OK: $OUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          debug: true
          script: |
            cd /var/www/guia-sisc
            git pull origin master
            npm ci
            npm run build
            echo "Deploy concluído — $(date)"
