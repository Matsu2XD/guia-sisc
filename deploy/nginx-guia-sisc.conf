# Nginx — guia-sisc.sedsodh.org
# Config inicial (HTTP). O Certbot adiciona automaticamente as linhas SSL
# (listen 443, ssl_certificate, etc.) ao rodar `certbot --nginx`.

server {
    server_name guia-sisc.sedsodh.org;

    root /var/www/guia-sisc/dist;
    index index.html;

    location /pagefind/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 80;
}

# Após rodar `certbot --nginx -d guia-sisc.sedsodh.org`, o Certbot reescreve o
# bloco acima e adiciona o bloco HTTPS + redirect abaixo:

